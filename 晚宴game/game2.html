<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解密任務</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --cyan: #6ffcff;
      --cyan-2: #00d5ff;
      --green: #74ffb5;
      --red: #ff6060;
      --yellow: #ffe66d;
      --dark: #020817;
      --panel: rgba(2, 12, 27, 0.78);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      color: #eafcff;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(0, 255, 255, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 120, 255, 0.25), transparent 40%),
        linear-gradient(135deg, #020617 0%, #071426 45%, #020617 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridMove 12s linear infinite;
      pointer-events: none;
    }

    body::after {
      content: "01001101 101101 110010 001101 2026 AUTH KEY HASH LOCK SYS DATA SECURE ACCESS BLOCKED";
      position: fixed;
      top: -10%;
      left: 0;
      width: 100%;
      height: 120%;
      color: rgba(91, 255, 255, 0.12);
      font-size: 28px;
      letter-spacing: 18px;
      line-height: 2.2;
      word-break: break-all;
      transform: rotate(-12deg);
      animation: codeRain 16s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 42px 42px; }
    }

    @keyframes codeRain {
      from { transform: translateY(-10%) rotate(-12deg); }
      to { transform: translateY(10%) rotate(-12deg); }
    }

    .game {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .panel {
      width: min(1080px, 94vw);
      min-height: 660px;
      padding: 34px;
      border: 1px solid rgba(114, 255, 255, 0.35);
      border-radius: 28px;
      background: var(--panel);
      box-shadow:
        0 0 38px rgba(0, 255, 255, 0.18),
        inset 0 0 34px rgba(0, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(0, 255, 255, 0.08) 40%,
        transparent 70%
      );
      transform: translateX(-100%);
      animation: scan 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { transform: translateX(-120%); }
      60% { transform: translateX(120%); }
      100% { transform: translateX(120%); }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 3;
    }

    .title {
      margin: 0;
      font-size: 44px;
      letter-spacing: 10px;
      color: #bfffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }

    .subtitle {
      margin: 10px 0 0;
      color: #9bd7e2;
      font-size: 18px;
    }

    .timer {
      min-width: 160px;
      padding: 18px 24px;
      border-radius: 18px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      background: rgba(0, 30, 48, 0.7);
      text-align: center;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.2);
    }

    .timer-label {
      font-size: 14px;
      color: #8fdde8;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .timer-value {
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 16px rgba(0, 255, 255, 0.9);
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-shrink: 0;
    }

    .fullscreen-btn {
      border: 1px solid rgba(0, 255, 255, 0.45);
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      color: #dfffff;
      background: rgba(0, 30, 48, 0.74);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.18);
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      white-space: nowrap;
    }

    .fullscreen-btn:hover {
      transform: translateY(-1px);
      background: rgba(0, 70, 92, 0.78);
      box-shadow: 0 0 26px rgba(0, 255, 255, 0.42);
    }

    .danger .timer-value {
      color: var(--red);
      text-shadow: 0 0 18px rgba(255, 0, 0, 0.8);
      animation: pulse 0.65s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .panel.wrong-shake {
      animation: panelShake 0.38s ease both;
    }

    @keyframes panelShake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-10px); }
      36% { transform: translateX(10px); }
      54% { transform: translateX(-7px); }
      72% { transform: translateX(7px); }
    }

    .panel.overload-mode {
      border-color: rgba(255, 80, 80, 0.9);
      box-shadow:
        0 0 46px rgba(255, 40, 40, 0.42),
        inset 0 0 42px rgba(255, 40, 40, 0.14);
      animation: overloadPulse 0.55s infinite alternate;
    }

    @keyframes overloadPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.22); }
    }

    .panel.success-mode {
      border-color: rgba(116, 255, 181, 0.9);
      box-shadow:
        0 0 54px rgba(116, 255, 181, 0.38),
        inset 0 0 42px rgba(116, 255, 181, 0.12);
    }

    .panel.unlock-flash {
      animation: panelUnlockFlash 1.45s ease both;
    }

    @keyframes panelUnlockFlash {
      0% {
        border-color: rgba(0, 255, 255, 0.35);
        box-shadow:
          0 0 38px rgba(0, 255, 255, 0.18),
          inset 0 0 34px rgba(0, 255, 255, 0.07);
      }
      18%, 55% {
        border-color: rgba(116, 255, 181, 1);
        box-shadow:
          0 0 72px rgba(116, 255, 181, 0.62),
          inset 0 0 64px rgba(116, 255, 181, 0.22);
      }
      100% {
        border-color: rgba(114, 255, 255, 0.35);
        box-shadow:
          0 0 38px rgba(0, 255, 255, 0.18),
          inset 0 0 34px rgba(0, 255, 255, 0.07);
      }
    }

    .intro,
    .stage-area {
      position: relative;
      z-index: 2;
    }

    .intro {
      margin-top: 56px;
      text-align: center;
    }

    .intro h2 {
      font-size: 34px;
      margin: 0 0 20px;
      color: #ffffff;
    }

    .intro p {
      width: min(780px, 100%);
      margin: 0 auto 30px;
      font-size: 21px;
      line-height: 1.85;
      color: #d7fbff;
    }


    .start-btn,
    .answer-btn,
    .restart-btn {
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      color: #001018;
      background: linear-gradient(135deg, #7dffff, #00d5ff);
      box-shadow: 0 0 28px rgba(0, 255, 255, 0.45);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .start-btn:hover,
    .answer-btn:hover,
    .restart-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 36px rgba(0, 255, 255, 0.75);
    }

    .stage-area {
      display: none;
      margin-top: 30px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .progress-dot {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      border: 1px solid rgba(0, 255, 255, 0.35);
      background: rgba(0, 18, 36, 0.8);
      color: rgba(220, 255, 255, 0.55);
      box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.07);
      transition: 0.35s;
    }

    .progress-dot.active {
      transform: scale(1.16);
      color: #ffffff;
      border-color: rgba(0, 255, 255, 0.9);
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.55);
    }

    .progress-dot.done {
      color: #001812;
      background: linear-gradient(135deg, #7dffbe, #20d984);
      border-color: rgba(125, 255, 190, 0.95);
      box-shadow: 0 0 20px rgba(125, 255, 190, 0.4);
    }

    .progress-line {
      width: min(110px, 12vw);
      height: 4px;
      border-radius: 99px;
      background: rgba(0, 255, 255, 0.22);
      overflow: hidden;
    }

    .progress-line span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      transition: width 0.45s;
    }

    .progress-line.done span {
      width: 100%;
    }

    .stage-card-wrap {
      position: relative;
      min-height: 410px;
      perspective: 1200px;
    }

    .stage-card {
      width: min(820px, 100%);
      min-height: 410px;
      margin: 0 auto;
      padding: 32px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 20% 10%, rgba(0, 255, 255, 0.16), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(0, 120, 255, 0.16), transparent 34%),
        rgba(1, 18, 34, 0.92);
      border: 1px solid rgba(0, 255, 255, 0.38);
      text-align: center;
      box-shadow:
        0 0 32px rgba(0, 255, 255, 0.16),
        inset 0 0 32px rgba(0, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      transform-origin: center;
    }

    .stage-card.wrong-flash {
      border-color: rgba(255, 96, 96, 0.95);
      box-shadow:
        0 0 38px rgba(255, 96, 96, 0.45),
        inset 0 0 34px rgba(255, 96, 96, 0.18);
    }

    .stage-card.entering {
      animation: cardEnter 0.48s ease both;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateX(80px) rotateY(-12deg) scale(0.96);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotateY(0) scale(1);
        filter: blur(0);
      }
    }

    .stage-card.unlocking {
      animation: unlockCard 1.45s ease both;
      border-color: rgba(116, 255, 181, 0.95);
      box-shadow:
        0 0 48px rgba(116, 255, 181, 0.45),
        inset 0 0 42px rgba(116, 255, 181, 0.16);
    }

    @keyframes unlockCard {
      0% { opacity: 1; transform: translateX(0) scale(1); filter: brightness(1); }
      18% { opacity: 1; transform: translateX(0) scale(1.04); filter: brightness(1.35); }
      72% { opacity: 1; transform: translateX(0) scale(1.02); filter: brightness(1.18); }
      100% { opacity: 0; transform: translateX(-60px) scale(0.96); filter: brightness(1.05) blur(2px); }
    }

    .circuit-lines {
      position: absolute;
      inset: 0;
      opacity: 0.25;
      background:
        linear-gradient(90deg, transparent 0 12%, rgba(0, 255, 255, 0.18) 12% 12.3%, transparent 12.3% 100%),
        linear-gradient(0deg, transparent 0 22%, rgba(0, 255, 255, 0.18) 22% 22.3%, transparent 22.3% 100%),
        linear-gradient(90deg, transparent 0 67%, rgba(0, 255, 255, 0.18) 67% 67.3%, transparent 67.3% 100%),
        linear-gradient(0deg, transparent 0 72%, rgba(0, 255, 255, 0.18) 72% 72.3%, transparent 72.3% 100%);
      pointer-events: none;
    }


    .stage-label {
      display: inline-block;
      padding: 8px 17px;
      border-radius: 999px;
      background: rgba(0, 255, 255, 0.12);
      border: 1px solid rgba(0, 255, 255, 0.28);
      color: #8fffff;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .lock-visual {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 34px;
      border: 1px solid rgba(0, 255, 255, 0.42);
      background: rgba(2, 15, 30, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 62px;
      box-shadow:
        0 0 28px rgba(0, 255, 255, 0.2),
        inset 0 0 24px rgba(0, 255, 255, 0.08);
      position: relative;
      z-index: 2;
      transition: 0.3s;
    }

    .stage-card.unlocking .lock-visual {
      color: var(--green);
      border-color: var(--green);
      background: rgba(3, 58, 40, 0.86);
      box-shadow:
        0 0 46px rgba(116, 255, 181, 0.72),
        inset 0 0 30px rgba(116, 255, 181, 0.18);
      animation: lockPop 0.78s ease both;
    }

    @keyframes lockPop {
      0% { transform: scale(1) rotate(0deg); }
      28% { transform: scale(1.2) rotate(-8deg); }
      50% { transform: scale(1.08) rotate(8deg); }
      100% { transform: scale(1.12) rotate(0deg); }
    }

    .question-text {
      min-height: 82px;
      margin: 6px auto 24px;
      width: min(700px, 100%);
      font-size: 31px;
      line-height: 1.45;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.22);
      position: relative;
      z-index: 2;
    }

    .answer-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .answer-input {
      width: min(380px, 90%);
      padding: 16px 20px;
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 255, 0.45);
      outline: none;
      font-size: 22px;
      text-align: center;
      color: #ffffff;
      background: rgba(0, 8, 18, 0.78);
      box-shadow: inset 0 0 14px rgba(0, 255, 255, 0.12);
    }

    .answer-input:focus {
      border-color: #7dffff;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.35);
    }

    .answer-input:disabled,
    .answer-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 34px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: 800;
      position: relative;
      z-index: 2;
    }

    .message.error {
      color: #ff8b8b;
    }

    .message.success {
      color: #7dffbe;
    }

    .unlock-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background:
        radial-gradient(circle at center, rgba(116, 255, 181, 0.24), transparent 42%),
        rgba(0, 10, 20, 0.78);
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .stage-card.unlocking .unlock-overlay {
      animation: overlayIn 1.45s ease both;
    }

    .stage-card.unlocking .unlock-overlay::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -35%;
      width: 24%;
      background: linear-gradient(90deg, transparent, rgba(125, 255, 190, 0.8), transparent);
      filter: blur(2px);
      animation: accessScan 1.05s ease-out both;
    }

    .stage-card.unlocking .unlock-overlay::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(116, 255, 181, 0.52);
      border-radius: 22px;
      box-shadow: inset 0 0 28px rgba(116, 255, 181, 0.18);
      animation: accessFrame 1.1s ease both;
    }

    @keyframes overlayIn {
      0% { opacity: 0; transform: scale(1.08); }
      16% { opacity: 1; transform: scale(1); }
      78% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.96); }
    }

    @keyframes accessScan {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateX(620%); opacity: 0; }
    }

    @keyframes accessFrame {
      0% { opacity: 0; transform: scale(0.86); }
      25% { opacity: 1; transform: scale(1); }
      78% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.08); }
    }

    .unlock-overlay strong {
      font-size: 56px;
      color: var(--green);
      letter-spacing: 5px;
      text-shadow:
        0 0 18px rgba(116, 255, 181, 1),
        0 0 42px rgba(116, 255, 181, 0.65);
      margin-bottom: 2px;
      position: relative;
      z-index: 2;
      animation: accessTextPop 1.12s ease both;
    }

    .unlock-overlay span {
      font-size: 24px;
      color: #ffffff;
      position: relative;
      z-index: 2;
      letter-spacing: 1px;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
    }

    @keyframes accessTextPop {
      0% { opacity: 0; transform: translateY(16px) scale(0.88); filter: blur(6px); }
      24% { opacity: 1; transform: translateY(0) scale(1.05); filter: blur(0); }
      78% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }

    .pressure-wrap.pressure-spike .pressure-bar {
      box-shadow: 0 0 24px rgba(255, 96, 96, 0.65);
      border-color: rgba(255, 96, 96, 0.9);
    }

    .pressure-wrap.pressure-spike .pressure-fill {
      filter: brightness(1.8) saturate(1.4);
    }

    .pressure-wrap {
      width: min(820px, 100%);
      margin: 24px auto 0;
      position: relative;
      z-index: 2;
    }

    .pressure-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #b6eff7;
      font-size: 15px;
    }

    .pressure-bar {
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }

    .pressure-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00eaff, #ffe66d, #ff4e4e);
      transition: width 0.3s linear;
    }

    .ending {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(1, 8, 18, 0.94);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px;
    }

    .ending.success-ending {
      background:
        radial-gradient(circle at center, rgba(116, 255, 181, 0.24), transparent 42%),
        rgba(1, 8, 18, 0.95);
    }

    .ending.fail-ending {
      background:
        radial-gradient(circle at center, rgba(255, 70, 70, 0.28), transparent 42%),
        rgba(28, 2, 8, 0.96);
      animation: failBgFlash 0.68s infinite alternate;
    }

    @keyframes failBgFlash {
      from { box-shadow: inset 0 0 40px rgba(255, 60, 60, 0.12); }
      to { box-shadow: inset 0 0 90px rgba(255, 60, 60, 0.34); }
    }

    .ending-box {
      width: min(760px, 100%);
      border-radius: 28px;
      padding: 42px;
      border: 1px solid rgba(0, 255, 255, 0.4);
      background: rgba(3, 20, 38, 0.94);
      box-shadow: 0 0 42px rgba(0, 255, 255, 0.18);
      animation: endingPop 0.45s ease both;
    }

    @keyframes endingPop {
      from { opacity: 0; transform: scale(0.88) translateY(24px); filter: blur(5px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .success-ending .ending-box {
      border-color: rgba(116, 255, 181, 0.85);
      box-shadow: 0 0 50px rgba(116, 255, 181, 0.32);
    }

    .fail-ending .ending-box {
      border-color: rgba(255, 96, 96, 0.85);
      box-shadow: 0 0 56px rgba(255, 60, 60, 0.36);
    }

    .ending h2 {
      margin: 0 0 18px;
      font-size: 42px;
    }

    .ending p {
      font-size: 24px;
      line-height: 1.6;
      margin: 0 0 30px;
    }

    .success-title {
      color: var(--green);
      text-shadow: 0 0 18px rgba(125, 255, 190, 0.75);
    }

    .fail-title {
      color: #ff7b7b;
      text-shadow: 0 0 18px rgba(255, 60, 60, 0.75);
    }

    @media (max-width: 720px) {
      .game {
        padding: 18px;
      }

      .panel {
        padding: 22px;
        min-height: 680px;
      }

      .top-bar {
        flex-direction: column;
      }

      .title {
        font-size: 34px;
        text-align: center;
        letter-spacing: 7px;
      }

      .subtitle {
        text-align: center;
      }


      .stage-card {
        padding: 24px 18px;
      }

      .question-text {
        font-size: 24px;
      }

      .lock-visual {
        width: 96px;
        height: 96px;
        font-size: 52px;
      }

      .progress-line {
        width: 42px;
      }
    }


    /* RWD：投影、筆電、平板、手機都會自動縮放 */
    .game {
      min-height: 100svh;
      padding: clamp(12px, 2.5vw, 32px);
    }

    .panel {
      width: min(1080px, 96vw);
      min-height: min(660px, calc(100svh - clamp(24px, 5vw, 64px)));
      max-height: calc(100svh - clamp(24px, 5vw, 64px));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 3vw, 34px);
      scrollbar-width: thin;
      scrollbar-color: rgba(111, 252, 255, 0.55) rgba(255, 255, 255, 0.06);
    }

    .panel::-webkit-scrollbar {
      width: 8px;
    }

    .panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(111, 252, 255, 0.55);
      border-radius: 999px;
    }

    .top-bar {
      flex-shrink: 0;
    }

    .intro,
    .stage-area {
      flex: 1;
    }

    .title {
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: clamp(5px, 1vw, 10px);
    }

    .intro {
      margin-top: clamp(34px, 7vh, 56px);
    }

    .intro p {
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.8;
    }

    .timer {
      min-width: clamp(122px, 14vw, 160px);
      padding: clamp(12px, 2vw, 18px) clamp(16px, 2.5vw, 24px);
    }

    .timer-value {
      font-size: clamp(34px, 5vw, 44px);
    }

    .start-btn,
    .answer-btn,
    .restart-btn {
      font-size: clamp(18px, 2.6vw, 22px);
      padding: clamp(13px, 2vw, 16px) clamp(26px, 4vw, 36px);
    }

    .stage-card-wrap {
      min-height: clamp(330px, 50vh, 410px);
    }

    .stage-card {
      min-height: clamp(330px, 50vh, 410px);
      padding: clamp(20px, 3vw, 32px);
    }

    .stage-label {
      font-size: clamp(13px, 1.7vw, 16px);
    }

    .lock-visual {
      width: clamp(88px, 12vw, 120px);
      height: clamp(88px, 12vw, 120px);
      font-size: clamp(46px, 7vw, 62px);
      margin-bottom: clamp(12px, 2.2vw, 20px);
    }

    .question-text {
      font-size: clamp(22px, 3vw, 31px);
      min-height: clamp(58px, 11vh, 82px);
    }

    .answer-input {
      width: min(380px, 100%);
      font-size: clamp(18px, 2.6vw, 22px);
    }

    .unlock-overlay strong {
      font-size: clamp(34px, 7vw, 56px);
      letter-spacing: clamp(2px, 0.8vw, 5px);
    }

    .unlock-overlay span {
      font-size: clamp(17px, 3vw, 24px);
      padding: 0 18px;
    }

    .ending h2 {
      font-size: clamp(30px, 7vw, 42px);
    }

    .ending p {
      font-size: clamp(18px, 4vw, 24px);
    }

    @media (max-width: 720px) {
      body::after {
        font-size: 20px;
        letter-spacing: 12px;
      }

      .panel {
        width: 96vw;
        max-height: calc(100svh - 24px);
        border-radius: 22px;
      }

      .top-bar {
        gap: 14px;
      }

      .hud {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      .fullscreen-btn {
        padding: 12px 18px;
        font-size: 15px;
      }

      .progress-row {
        gap: 10px;
      }

      .progress-dot {
        width: 38px;
        height: 38px;
      }

      .progress-line {
        width: clamp(28px, 8vw, 42px);
      }

      .answer-row {
        flex-direction: column;
        align-items: center;
      }

      .answer-input,
      .answer-btn {
        width: 100%;
        max-width: 420px;
      }

      .pressure-wrap {
        margin-top: 18px;
      }

      .ending {
        padding: 20px;
      }

      .ending-box {
        padding: 32px 22px;
      }
    }

    @media (max-height: 720px) and (min-width: 721px) {
      .panel {
        min-height: calc(100svh - 24px);
        max-height: calc(100svh - 24px);
      }

      .intro {
        margin-top: 36px;
      }

      .stage-area {
        margin-top: 16px;
      }

      .progress-row {
        margin-bottom: 14px;
      }

      .stage-card-wrap,
      .stage-card {
        min-height: 330px;
      }

      .lock-visual {
        width: 86px;
        height: 86px;
        font-size: 46px;
      }

      .question-text {
        min-height: 58px;
        margin-bottom: 16px;
      }

      .pressure-wrap {
        margin-top: 14px;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .title {
        font-size: 28px;
        letter-spacing: 5px;
      }

      .timer {
        padding: 10px 14px;
      }

      .timer-value {
        font-size: 30px;
      }

      .stage-card-wrap,
      .stage-card {
        min-height: 280px;
      }

      .lock-visual {
        display: none;
      }

      .question-text {
        min-height: auto;
        font-size: 22px;
      }

      .progress-row {
        margin-bottom: 10px;
      }

      .pressure-wrap {
        margin-top: 10px;
      }
    }

  </style>
</head>

<body>
  <main class="game">
    <section class="panel">
      <div class="top-bar">
        <div>
          <h1 class="title">解密任務</h1>
        </div>

        <div class="hud">
          <div class="timer" id="timerBox">
            <div class="timer-label">COUNTDOWN</div>
            <div class="timer-value" id="timer">60</div>
          </div>
          <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">全螢幕</button>
        </div>
      </div>

      <div class="intro" id="intro">
        <p>
          任務說明：台股日均量突破5兆，系統壓力山大，處長須於一分鐘內解除三道密碼鎖。
        </p>
        <button class="start-btn" onclick="startGame()">開始任務</button>
      </div>

      <div class="stage-area" id="stageArea">
        <div class="progress-row">
          <div class="progress-dot active" id="dot0">1</div>
          <div class="progress-line" id="line0"><span></span></div>
          <div class="progress-dot" id="dot1">2</div>
          <div class="progress-line" id="line1"><span></span></div>
          <div class="progress-dot" id="dot2">3</div>
        </div>

        <div class="stage-card-wrap">
          <div class="stage-card entering" id="stageCard">
            <div class="circuit-lines"></div>
            <div class="stage-label" id="stageLabel">LOCK 01 / 03</div>
            <div class="lock-visual" id="lockVisual">🔒</div>
            <div class="question-text" id="questionText"></div>

            <div class="answer-row">
              <input
                class="answer-input"
                id="answerInput"
                type="text"
                placeholder="請輸入密碼答案"
                autocomplete="off"
                onkeydown="handleEnter(event)"
              />
              <button class="answer-btn" id="answerBtn" onclick="submitAnswer()">確認解鎖</button>
            </div>

            <div class="message" id="message"></div>

            <div class="unlock-overlay">
              <strong id="unlockTitle">ACCESS GRANTED</strong>
              <span id="unlockSubtitle">解鎖成功，進入下一道密碼鎖</span>
            </div>
          </div>
        </div>

        <div class="pressure-wrap">
          <div class="pressure-text">
            <span>系統壓力值</span>
            <span id="pressureText">0%</span>
          </div>
          <div class="pressure-bar">
            <div class="pressure-fill" id="pressureFill"></div>
          </div>
        </div>
      </div>

      <div class="ending" id="ending">
        <div class="ending-box">
          <h2 id="endingTitle"></h2>
          <p id="endingText"></p>
          <button class="restart-btn" onclick="restartGame()">重新開始</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      totalTime: 60,
      unlockDelay: 1450,
      questions: [
        {
          question: "國泰證券今年幾歲？",
          answer: "22"
        },
        {
          question: "2026 年 1 月到 7 月，國證台股市佔多少？",
          answer: "待補"
          // 之後把「待補」改成正確答案，例如 "12.3" 或 "12.3%"
        },
        {
          question: "國證西元幾年開辦複委託？",
          answer: "2012"
        }
      ]
    };

    let currentIndex = 0;
    let timeLeft = CONFIG.totalTime;
    let timerId = null;
    let gameRunning = false;
    let isTransitioning = false;
    let wrongPressurePenalty = 0;

    const panel = document.querySelector(".panel");
    const intro = document.getElementById("intro");
    const stageArea = document.getElementById("stageArea");
    const timer = document.getElementById("timer");
    const timerBox = document.getElementById("timerBox");
    const stageCard = document.getElementById("stageCard");
    const stageLabel = document.getElementById("stageLabel");
    const lockVisual = document.getElementById("lockVisual");
    const questionText = document.getElementById("questionText");
    const answerInput = document.getElementById("answerInput");
    const answerBtn = document.getElementById("answerBtn");
    const message = document.getElementById("message");
    const pressureWrap = document.querySelector(".pressure-wrap");
    const pressureFill = document.getElementById("pressureFill");
    const pressureText = document.getElementById("pressureText");
    const unlockTitle = document.getElementById("unlockTitle");
    const unlockSubtitle = document.getElementById("unlockSubtitle");
    const ending = document.getElementById("ending");
    const endingTitle = document.getElementById("endingTitle");
    const endingText = document.getElementById("endingText");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    function startGame() {
      currentIndex = 0;
      timeLeft = CONFIG.totalTime;
      wrongPressurePenalty = 0;
      gameRunning = true;
      isTransitioning = false;
      panel.classList.remove("wrong-shake", "overload-mode", "success-mode", "unlock-flash");
      ending.classList.remove("success-ending", "fail-ending");

      intro.style.display = "none";
      stageArea.style.display = "block";
      ending.style.display = "none";

      resetProgress();
      updateTimer();
      loadStage();

      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
          failGame();
        }
      }, 1000);
    }

    function updateTimer() {
      timer.textContent = timeLeft;

      const timePressure = ((CONFIG.totalTime - timeLeft) / CONFIG.totalTime) * 100;
      const rawPressure = timePressure + wrongPressurePenalty;
      const pressure = timeLeft <= 0 ? 100 : Math.min(98, Math.round(rawPressure));
      pressureFill.style.width = pressure + "%";
      pressureText.textContent = pressure + "%";

      if (timeLeft <= 10) {
        timerBox.classList.add("danger");
      } else {
        timerBox.classList.remove("danger");
      }
    }

    function loadStage() {
      const item = CONFIG.questions[currentIndex];

      stageCard.classList.remove("unlocking", "entering", "wrong-flash");
      void stageCard.offsetWidth;
      stageCard.classList.add("entering");

      stageLabel.textContent = `LOCK ${String(currentIndex + 1).padStart(2, "0")} / 03`;
      lockVisual.textContent = "🔒";
      questionText.textContent = item.question;

      answerInput.value = "";
      answerInput.disabled = false;
      answerBtn.disabled = false;
      message.textContent = "";
      message.className = "message";

      updateProgress();

      setTimeout(() => answerInput.focus(), 80);
    }

    function normalizeAnswer(value) {
      return value
        .trim()
        .replace(/\s+/g, "")
        .replace("％", "%");
    }

    function submitAnswer() {
      if (!gameRunning || isTransitioning) return;

      const userAnswer = normalizeAnswer(answerInput.value);
      const correctAnswer = normalizeAnswer(CONFIG.questions[currentIndex].answer);

      if (!userAnswer) {
        showMessage("請輸入答案。", "error");
        return;
      }

      if (userAnswer === correctAnswer) {
        beginUnlockTransition();
      } else {
        handleWrongAnswer();
      }
    }

    function handleWrongAnswer() {
      wrongPressurePenalty = Math.min(wrongPressurePenalty + 7, 35);
      updateTimer();
      showMessage("密碼錯誤，系統壓力上升！", "error");
      answerInput.select();

      panel.classList.remove("wrong-shake");
      stageCard.classList.remove("wrong-flash");
      pressureWrap.classList.remove("pressure-spike");
      void panel.offsetWidth;
      panel.classList.add("wrong-shake");
      stageCard.classList.add("wrong-flash");
      pressureWrap.classList.add("pressure-spike");

      setTimeout(() => {
        panel.classList.remove("wrong-shake");
        stageCard.classList.remove("wrong-flash");
        pressureWrap.classList.remove("pressure-spike");
      }, 420);
    }

    function beginUnlockTransition() {
      isTransitioning = true;
      answerInput.disabled = true;
      answerBtn.disabled = true;
      lockVisual.textContent = "🔓";
      showMessage("解鎖成功。", "success");
      unlockTitle.textContent = "ACCESS GRANTED";
      unlockSubtitle.textContent = currentIndex === CONFIG.questions.length - 1
        ? `LOCK ${String(currentIndex + 1).padStart(2, "0")} UNLOCKED｜所有密碼鎖已解除`
        : `LOCK ${String(currentIndex + 1).padStart(2, "0")} UNLOCKED｜正在進入下一道防線`;
      panel.classList.remove("unlock-flash");
      void panel.offsetWidth;
      panel.classList.add("unlock-flash");
      stageCard.classList.remove("entering");
      stageCard.classList.add("unlocking");

      markCurrentDone();

      setTimeout(() => {
        if (!gameRunning) return;

        if (currentIndex === CONFIG.questions.length - 1) {
          successGame();
          return;
        }

        currentIndex++;
        isTransitioning = false;
        panel.classList.remove("unlock-flash");
        loadStage();
      }, CONFIG.unlockDelay);
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function resetProgress() {
      for (let i = 0; i < CONFIG.questions.length; i++) {
        const dot = document.getElementById(`dot${i}`);
        dot.className = "progress-dot";
        dot.textContent = i + 1;
      }

      for (let i = 0; i < CONFIG.questions.length - 1; i++) {
        const line = document.getElementById(`line${i}`);
        line.className = "progress-line";
      }

      document.getElementById("dot0").classList.add("active");
    }

    function updateProgress() {
      for (let i = 0; i < CONFIG.questions.length; i++) {
        const dot = document.getElementById(`dot${i}`);
        dot.classList.remove("active");

        if (!dot.classList.contains("done") && i === currentIndex) {
          dot.classList.add("active");
        }
      }
    }

    function markCurrentDone() {
      const dot = document.getElementById(`dot${currentIndex}`);
      dot.classList.remove("active");
      dot.classList.add("done");
      dot.textContent = "✓";

      if (currentIndex < CONFIG.questions.length - 1) {
        document.getElementById(`line${currentIndex}`).classList.add("done");
      }
    }

    function successGame() {
      clearInterval(timerId);
      gameRunning = false;
      isTransitioning = false;

      panel.classList.add("success-mode");
      ending.classList.remove("fail-ending");
      ending.classList.add("success-ending");
      ending.style.display = "flex";
      endingTitle.textContent = "三道密碼鎖解除成功";
      endingTitle.className = "success-title";
      endingText.textContent = "系統壓力已恢復正常，任務完成！";
    }

    function failGame() {
      clearInterval(timerId);
      gameRunning = false;
      isTransitioning = false;
      timeLeft = 0;
      updateTimer();

      answerInput.disabled = true;
      answerBtn.disabled = true;

      panel.classList.add("overload-mode");
      ending.classList.remove("success-ending");
      ending.classList.add("fail-ending");
      ending.style.display = "flex";
      endingTitle.textContent = "SYSTEM OVERLOAD";
      endingTitle.className = "fail-title";
      endingText.textContent = "系統承受不住壓力。任務失敗！";
    }

    function restartGame() {
      clearInterval(timerId);

      currentIndex = 0;
      timeLeft = CONFIG.totalTime;
      wrongPressurePenalty = 0;
      gameRunning = false;
      isTransitioning = false;
      panel.classList.remove("wrong-shake", "overload-mode", "success-mode", "unlock-flash");
      ending.classList.remove("success-ending", "fail-ending");

      timer.textContent = CONFIG.totalTime;
      timerBox.classList.remove("danger");
      pressureFill.style.width = "0%";
      pressureText.textContent = "0%";

      stageCard.classList.remove("unlocking", "entering", "wrong-flash");
      ending.style.display = "none";
      stageArea.style.display = "none";
      intro.style.display = "block";
      resetProgress();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        submitAnswer();
      }
    }


    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
    }

    function requestFullScreenMode() {
      const target = document.documentElement;

      if (target.requestFullscreen) {
        return target.requestFullscreen();
      }

      if (target.webkitRequestFullscreen) {
        return target.webkitRequestFullscreen();
      }

      if (target.msRequestFullscreen) {
        return target.msRequestFullscreen();
      }

      alert("這個瀏覽器不支援全螢幕模式，建議改用 Chrome 或 Edge 開啟。");
      return null;
    }

    function exitFullScreenMode() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      }

      if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      }

      if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }

      return null;
    }

    function toggleFullscreen() {
      if (getFullscreenElement()) {
        exitFullScreenMode();
      } else {
        requestFullScreenMode();
      }
    }

    function updateFullscreenButton() {
      if (!fullscreenBtn) return;
      fullscreenBtn.textContent = getFullscreenElement() ? "退出全螢幕" : "全螢幕";
    }

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("msfullscreenchange", updateFullscreenButton);
    updateFullscreenButton();

  </script>
</body>
</html>
